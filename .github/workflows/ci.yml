name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ['1.25', 'stable']
    runs-on: ${{ matrix.os }}
    steps:
      # Check files out as committed, with LF line ends, on Windows too:
      # the source-hygiene tests and the fixtures depend on exact bytes.
      - name: Keep line ends as committed
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}

      - name: Format
        if: matrix.os == 'ubuntu-latest'
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: Vet
        run: go vet ./...

      # Tests that need the public corpus skip themselves when it is
      # absent, as here.
      - name: Test
        run: go test -race ./...

      # Systems the tests do not run on, among them ones where an int is
      # 32 bits: the code must at least build and pass vet there.
      - name: Other systems
        if: matrix.os == 'ubuntu-latest'
        run: |
          for target in linux/386 linux/arm linux/arm64 freebsd/amd64 js/wasm; do
            echo "$target"
            GOOS=${target%/*} GOARCH=${target#*/} go vet ./...
          done

      # The xmlscanpoison tag overwrites each token once the next is
      # asked for, so a reader that keeps a view too long reads '#'.
      - name: Test, xmlscanpoison
        if: matrix.os == 'ubuntu-latest'
        run: go test -short -tags xmlscanpoison ./xmlscan/ ./opc/

      - name: Test, 32-bit
        if: matrix.os == 'ubuntu-latest'
        run: GOARCH=386 go test -short ./...

  fuzz:
    # Every fuzz target, 20 s each, one job per target so that they run
    # side by side with the tests. inflate, ziprecover, charset, xmlscan
    # and cfb read untrusted input for every library in the series; numfmt
    # shows every cell.
    strategy:
      fail-fast: false
      matrix:
        target:
          - . FuzzDocumentJSON
          - ./numfmt FuzzNumFmt
          - ./numfmt FuzzWhole
          - ./numfmt FuzzCache
          - ./ziprecover FuzzRecover
          - ./inflate FuzzZlib
          - ./inflate FuzzRaw
          - ./inflate FuzzGzip
          - ./inflate FuzzAdler32
          - ./inflate FuzzRawReader
          - ./inflate FuzzReaderInputOffset
          - ./inflate FuzzGzipReader
          - ./charset FuzzCharset
          - ./charset FuzzDoubleByte
          - ./charset FuzzPiecesAgree
          - ./xmlscan FuzzXML
          - ./xmlscan FuzzXMLScanner
          - ./cfb FuzzCFB
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Fuzz
        run: |
          set -- ${{ matrix.target }}
          go test -run '^$' -fuzz "^$2\$" -fuzztime 20s -fuzzminimizetime 0s "$1"

      # A new fuzz target must be added above: this fails when one is not.
      - name: Every target listed
        if: matrix.target == '. FuzzDocumentJSON'
        run: |
          listed=$(grep -E '^ +- [./a-z]+ Fuzz[A-Za-z0-9]+$' .github/workflows/ci.yml | awk '{print $3}' | sort -u)
          found=$(grep -rhoE '^func Fuzz[A-Za-z0-9]+' --include='*_test.go' . | sed 's/^func //' | sort -u)
          if [ "$listed" != "$found" ]; then echo "fuzz targets in the code and in ci.yml differ:"; diff <(echo "$listed") <(echo "$found"); exit 1; fi

  dependencies:
    # The series rule: the standard library and go-fast modules only.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Standard library only
        run: |
          extra=$(go list -m all | awk 'NR>1 {print $1}' || true)
          if [ -n "$extra" ]; then echo "unexpected modules:"; echo "$extra"; exit 1; fi
          extra=$(go list -deps -test -f '{{if not .Standard}}{{.ImportPath}}{{end}}' ./... | grep -v '^github.com/AOShei/go-fast-core' || true)
          if [ -n "$extra" ]; then echo "unexpected packages:"; echo "$extra"; exit 1; fi
